version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: church-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    container_name: church-api
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
    restart: unless-stopped

volumes:
  redis_data: